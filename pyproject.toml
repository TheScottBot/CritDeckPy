[project]
name = "critdeck"
version = "0.1.0.dev0"
description = "A Discord bot that builds a shuffled critical hit deck for a party level and draws from it"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TheScottBot" }]
# Pinned exactly, matching the hashed deployment lock in deploy/.
dependencies = [
    "discord.py==2.7.1",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
critdeck = "critdeck.bot:main"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["critdeck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# discord.py's own deprecation warnings on newer Pythons; nothing to do with this code.
filterwarnings = ["ignore::DeprecationWarning:discord.*"]
